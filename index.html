
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Uno Royale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1a1a;
            user-select: none;
        }
        /* Texto temático mais legível sem contorno agressivo */
        .clash-text {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
        .clash-button {
            transition: transform 0.1s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .clash-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }
        /* Animação de distribuição */
        @keyframes deal {
            from { transform: translate(-100vw, -100vh) rotate(360deg); }
            to { transform: translate(0, 0) rotate(0deg); }
        }
        .card-deal {
            animation: deal 0.5s ease-out forwards;
        }
    </style>
<script type="importmap">

</head>

</body>
</html>
