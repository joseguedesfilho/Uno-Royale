<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Uno Royale</title>
    <!-- Tailwind via Vite plugin: CSS import em index.tsx -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a2b45; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .clash-text {
            letter-spacing: -0.5px;
        }

        .btn-3d {
            transition: all 0.1s;
            border-bottom-width: 6px;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .bg-royale-blue { background: linear-gradient(to bottom, #3558a7, #1a2b45); }
        .bg-royale-gold { background: linear-gradient(to bottom, #f59e0b, #d97706); }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Brilhos de Arena Corrigidos */
        .glow-red { box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }
        .glow-blue { box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); }
        .glow-yellow { box-shadow: 0 0 30px rgba(234, 179, 8, 0.5); }
        .glow-green { box-shadow: 0 0 30px rgba(34, 197, 94, 0.5); }

        /* Animação do Rei Narrador */
        @keyframes kingWhisper {
            0% { opacity: 0; transform: scale(0.5) translateY(50px); filter: blur(10px); }
            15% { opacity: 1; transform: scale(1.1) translateY(0); filter: blur(0); }
            85% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.2) translateY(-50px); filter: blur(10px); }
        }
        .animate-king-whisper {
            animation: kingWhisper 3.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>

  <link rel="stylesheet" crossorigin href="/Uno-Royale/assets/index-RctwDIP3.css">
</head>
<body>
    <div id="root"></div>
</body>
</html>
