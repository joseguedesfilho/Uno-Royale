<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Uno Royale</title>
    <!-- Tailwind JIT -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        // Polyfill robusto para process.env
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        // Não sobrescreve se já existir uma chave injetada pelo ambiente
        if (typeof window.process.env.API_KEY === 'undefined') {
            window.process.env.API_KEY = "";
        }
    </script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a2b45; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .clash-text {
            letter-spacing: -0.5px;
        }

        .btn-3d {
            transition: all 0.1s;
            border-bottom-width: 6px;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .bg-royale-blue { background: linear-gradient(to bottom, #3558a7, #1a2b45); }
        .bg-royale-gold { background: linear-gradient(to bottom, #f59e0b, #d97706); }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Brilhos de Arena Corrigidos */
        .glow-red { box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); }
        .glow-blue { box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); }
        .glow-yellow { box-shadow: 0 0 30px rgba(234, 179, 8, 0.5); }
        .glow-green { box-shadow: 0 0 30px rgba(34, 197, 94, 0.5); }

        /* Animação do Rei Narrador */
        @keyframes kingWhisper {
            0% { opacity: 0; transform: scale(0.5) translateY(50px); filter: blur(10px); }
            15% { opacity: 1; transform: scale(1.1) translateY(0); filter: blur(0); }
            85% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.2) translateY(-50px); filter: blur(10px); }
        }
        .animate-king-whisper {
            animation: kingWhisper 3.5s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "zustand": "https://esm.sh/zustand@^5.0.9",
    "zustand/": "https://esm.sh/zustand@^5.0.9/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
